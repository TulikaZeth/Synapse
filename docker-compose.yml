version: '3.8'

services:
  # Neo4j Property Graph Database (Optional - system falls back to embedded graph if disabled)
  neo4j:
    image: neo4j:5.18.0
    container_name: graphrag_neo4j
    ports:
      - "7474:7474" # Browser Web UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphrag_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/graphrag.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - GRAPH_PERSIST_FILE=/app/data/embedded_graph.json
      - NEO4J_ENABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - backend_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  backend_data:

