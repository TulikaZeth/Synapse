[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-synapse"
version = "1.0.0"
description = "GraphRAG: Knowledge Graph-Enhanced Retrieval-Augmented Generation Platform"
authors = [{ name = "Synapse Engineering" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "chromadb>=0.4.24",
    "networkx>=3.2.1",
    "neo4j>=5.18.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
